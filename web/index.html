<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InBody — динамика</title>
<!-- Установка как приложение; манифест и иконки отдаются без пароля (правило в Caddy) -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Шрифт не блокирует первую отрисовку; данные и фигуры качаются параллельно с разбором страницы -->
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="preload" href="/api/data" as="fetch" crossorigin="anonymous">
<link rel="preload" href="/figure/muscle.svg" as="image">
<link rel="preload" href="/figure/fat.svg" as="image">
<style>
  :root {
    --ink: #003e47; --muted: #6a7a7c; --line: #e4eeee; --rule: #a6b6b8; --hover: #b9d3d3;
    --ok: #12b76a; --ok-bg: #c7fbe1; --ok-ink: #0f8a50;
    --hi: #ff7d20; --hi-bg: #ffe3cc; --hi-ink: #c95500;
    --lo: #12d8d8; --lo-bg: #cdf6f6; --lo-ink: #08807f;
    --series: #8062b8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 500 14px/1.35 "Onest", system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  .row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .row.top { grid-template-columns: 1fr 2fr; }
  .stack { display: grid; gap: 12px; align-content: start; }
  @media (max-width: 760px) { .row, .row.top { grid-template-columns: 1fr; } }
  .card { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: #fff; min-width: 0; }
  .click { cursor: pointer; transition: border-color .15s, background-color .15s; }
  .click:hover, .click:focus-visible { border-color: var(--hover); outline: none; }
  .muted { color: var(--muted); }
  .error, .notice { margin: 0; background: var(--hi-bg); border-radius: 12px; padding: 10px 14px; }
  .notice { background: var(--ok-bg); }
  .upload { font: inherit; font-weight: 700; color: #fff; background: var(--ink); border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .upload:hover, .upload:focus-visible { background: #005966; }
  .export { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .export:hover, .export:focus-visible { background: #fff; border-color: var(--hover); }
  dialog { border: 1px solid var(--line); border-radius: 16px; padding: 16px; color: var(--ink); }
  dialog form { display: grid; gap: 12px; }
  dialog label { display: grid; gap: 4px; }
  dialog label.r { display: flex; align-items: center; gap: 8px; }
  dialog .btns { display: flex; gap: 8px; justify-content: flex-end; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; padding: 4px 2px 6px; }
  header .brand { font-weight: 800; font-size: 20px; margin-right: auto; }
  header .brand span { color: var(--series); }
  header .k { color: var(--muted); font-weight: 700; margin-right: 5px; }
  header b { font-weight: 700; }
  select { font: inherit; font-weight: 700; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; }

  .pill { display: inline-block; font-size: 12px; font-weight: 500; line-height: 1; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .ok { --c: var(--ok); --c-bg: var(--ok-bg); --c-ink: var(--ok-ink); }
  .hi { --c: var(--hi); --c-bg: var(--hi-bg); --c-ink: var(--hi-ink); }
  .lo { --c: var(--lo); --c-bg: var(--lo-bg); --c-ink: var(--lo-ink); }
  .pill { background: var(--c-bg); color: var(--c-ink); }
  .st { color: var(--c-ink); font-weight: 500; }

  .metric { display: flex; flex-direction: column; gap: 18px; }
  .metric .head { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
  .big { font-size: 34px; font-weight: 700; line-height: 1; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .trend { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .trend svg { width: 14px; height: 9px; }

  .score { display: flex; justify-content: space-between; gap: 16px; }
  .score .big span { font-size: 22px; font-weight: 500; color: var(--muted); }
  .score p { margin: 0; max-width: 230px; font-size: 11px; color: var(--muted); }

  .hist .hrow { display: grid; grid-template-columns: var(--cols); align-items: start; }
  .hist .hrow + .hrow + .hrow { border-top: 1px solid var(--line); }
  .hist .hrow.click { border-radius: 8px; }
  .hist .hrow.click:hover, .hist .hrow.click:focus-visible { background: #f6fafa; }
  .hist .title { font-weight: 700; color: var(--muted); padding-bottom: 4px; }
  .hist .d { font-size: 10px; color: var(--muted); text-align: center; padding-top: 3px; }
  .hist .lbl { font-weight: 700; padding: 10px 0 0 2px; }
  .hist .v { font-weight: 700; text-align: center; padding-top: 10px; border-left: 1px solid var(--line); height: 34px; }
  .hist svg { grid-column: 2 / -1; display: block; width: 100%; height: 30px; }

  .scale { display: grid; grid-template-columns: repeat(3, 1fr); font-size: 10px; color: var(--muted); }
  .scale :nth-child(2) { text-align: center; } .scale :nth-child(3) { text-align: right; }
  .rrow { display: block; padding: 9px 6px 3px; margin: 0 -6px; border-radius: 8px; }
  .rrow.click:hover, .rrow.click:focus-visible { background: #f6fafa; }
  .rrow .head { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .rrow .st { margin-left: 8px; }
  .bar { position: relative; display: flex; gap: 2px; height: 5px; margin: 7px 0 5px; }
  .bar i { flex: 1; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar b { display: block; height: 100%; background: var(--c); }
  .bar .dot { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--c); transform: translate(-50%, -50%); }

  .lead { display: flex; align-items: baseline; gap: 6px; padding: 7px 6px; margin: 0 -6px; border-radius: 8px; }
  .lead::after { content: ""; order: 1; flex: 1; border-bottom: 1px solid var(--rule); }
  .lead b { order: 2; font-weight: 700; }
  .lead.click:hover, .lead.click:focus-visible { background: #f6fafa; }
  h3 { margin: 0 0 4px; font-size: 14px; font-weight: 700; }

  .seghead { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 10px; }
  .fig { position: relative; aspect-ratio: 233.4 / 188.8; container-type: inline-size; }
  .fig img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .q { all: unset; position: absolute; width: 49.6%; height: 49.5%; border-radius: 10px; cursor: pointer; }
  .q:hover, .q:focus-visible { background: rgba(0, 62, 71, .05); box-shadow: inset 0 0 0 1px var(--hover); }
  .q.la { left: 0; top: 0; } .q.ra { right: 0; top: 0; } .q.ll { left: 0; bottom: 0; } .q.rl { right: 0; bottom: 0; }
  .q.trunk { left: 34%; width: 32%; top: 33%; height: 30%; z-index: 1; display: flex; justify-content: center; }
  .q .c { position: absolute; display: flex; flex-direction: column; gap: 1.2cqw; }
  .la .c, .ra .c { top: 23.5%; } .ll .c, .rl .c { bottom: 18%; }
  .la .c, .ll .c { left: 6.5%; align-items: flex-start; } .ra .c, .rl .c { right: 6.8%; align-items: flex-end; }
  .trunk .c { position: static; align-items: center; padding-top: 4%; white-space: nowrap; }
  .q .kg { font-size: 6.4cqw; font-weight: 500; line-height: 1; }
  .q .pill { font-size: max(10px, 2.6cqw); padding: .5cqw 2.2cqw; }
  .q .st { font-size: max(10px, 2.8cqw); }

  dialog { border: 0; border-radius: 16px; padding: 18px 20px 20px; width: min(860px, calc(100vw - 24px)); color: var(--ink); }
  dialog::backdrop { background: rgba(0, 30, 35, .35); }
  .dhead { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  .dhead h2 { margin: 0; font-size: 20px; }
  .dhead p { margin: 4px 0 0; color: var(--muted); }
  .x { all: unset; cursor: pointer; font-size: 26px; line-height: 1; padding: 0 6px; color: var(--muted); }
  .x:hover, .x:focus-visible { color: var(--ink); }
  .chart { position: relative; margin: 10px 0 6px; }
  .chart svg { display: block; width: 100%; height: 300px; overflow: visible; outline: none; cursor: crosshair;
               touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .chart svg:focus-visible { outline: 2px solid var(--hover); outline-offset: 4px; border-radius: 4px; }
  .ctools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .ctools button { all: unset; cursor: pointer; font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .ctools button:hover, .ctools button:focus-visible { border-color: var(--hover); color: var(--ink); }
  .ctools button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .hint { margin: 0 0 10px; font-size: 11px; color: var(--muted); }
  .chart text { font: 500 11px "Onest", system-ui, sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .chart text.end { fill: var(--ink); font-weight: 700; font-size: 12px; }
  .tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; white-space: nowrap; box-shadow: 0 4px 16px rgba(0, 40, 50, .12); }
  .tip b { display: block; font-size: 15px; }
  details summary { cursor: pointer; color: var(--muted); }
  .good { color: var(--ok-ink); } .bad { color: var(--hi-ink); }
  select.inline { font-size: 13px; padding: 1px 4px; margin: 0 2px; vertical-align: 1px; }
  .stats { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
  .stats b { color: var(--ink); }
  .tablewrap { overflow-x: auto; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th button { all: unset; cursor: pointer; color: var(--muted); font-weight: 500; }
  th button:hover, th button:focus-visible { color: var(--ink); }
  th[aria-sort] button { color: var(--ink); font-weight: 700; }
  th .arrow { display: inline-block; width: 1.1em; font-size: 9px; text-align: center; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: #fff; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background-color: #f6fafa; }
  tbody tr:focus-visible { outline: 2px solid var(--hover); outline-offset: -2px; }
  tr.sel td { background-color: #eef5f5; font-weight: 700; }
  tr.sel td:first-child { box-shadow: inset 3px 0 var(--ink); }
  tr.old td { opacity: .5; }
  tr.gap td { text-align: left; padding-left: 16px; font-size: 11px; color: var(--muted); padding: 3px; background: #f6fafa; cursor: default; }
  .badge { display: inline-block; margin-left: 6px; padding: 2px 6px; border-radius: 999px; font-size: 10px; font-weight: 700; line-height: 1.2; vertical-align: 1px; background: var(--ok-bg); color: var(--ok-ink); }
  .badge.old { background: var(--line); color: var(--muted); }
</style>
</head>
<body>
<main id="app"><p class="muted">Загрузка…</p></main>
<dialog id="dlg"></dialog>
<script>
const BODY = { weight: 'Вес', muscle: 'Мышцы', fat: 'Жир', water: 'Вода', protein: 'Белок', bones: 'Кости',
               visceral_fat: 'Висцеральный жир', bmi: 'Индекс массы тела', lean_mass: 'Безжировая масса' };
const SEG = { left_arm: 'Левая рука', right_arm: 'Правая рука', trunk: 'Торс', left_leg: 'Левая нога', right_leg: 'Правая нога' };
const BLK = { segmental_muscle: 'Мышцы', segmental_fat: 'Жир' };
const ST = { 'Норма': 'ok', 'Выше нормы': 'hi', 'Ниже нормы': 'lo' };
const MON = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const SVGNS = 'http://www.w3.org/2000/svg';

let recs = [], idx = 0, errors = [], notices = [], openKey = null, settings = {};
const app = document.getElementById('app'), dlg = document.getElementById('dlg');

// --- DOM: строки из PDF вставляются только как текст ---
function el(ns, tag, props, kids) {
  const e = ns ? document.createElementNS(ns, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  e.append(...kids.flat(9).filter(k => k != null && k !== false));
  return e;
}
const h = (tag, props, ...kids) => el(null, tag, props, kids);
const s = (tag, props, ...kids) => el(SVGNS, tag, props, kids);

// --- форматирование ---
const r2 = v => Math.round(v * 100) / 100;
const fmt = v => String(r2(v));
const withUnit = (v, u) => (typeof v === 'number' ? fmt(v) : v) + (u ? ` ${u}` : '');
const signed = v => (v > 0 ? '+' : '') + fmt(v);
const dmy = iso => `${iso.slice(8, 10)}.${iso.slice(5, 7)}.${iso.slice(2, 4)}`;
const cls = status => ST[status] || 'ok';
const pill = (text, status) => h('span', { class: `pill ${cls(status)}` }, text);

// Карточка/строка открывает график метрики
function act(node, key) {
  node.classList.add('click');
  node.tabIndex = 0;
  node.setAttribute('role', 'button');
  node.addEventListener('click', () => openChart(key));
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openChart(key); } });
  return node;
}

// --- метрики: ключ -> как достать значение из замера ---
function metric(key) {
  const [a, b] = key.split('.');
  if (a === 'body') return {
    title: BODY[b], unit: recs.at(-1).body[b].unit || '', better: BETTER[b] || 0,
    value: r => r.body[b].value, range: r => r.body[b].range, status: r => r.body[b].status,
  };
  if (a === 'score') return { title: 'Оценка InBody', unit: '', better: 1, value: r => r.inbody_score };
  const better = a === 'segmental_muscle' ? 1 : -1;
  if (b === 'total_kg') return { title: `${BLK[a]}: всего`, unit: 'кг', better, value: r => r[a].total_kg };
  return {
    title: `${BLK[a]}: ${SEG[b].toLowerCase()}`, unit: 'кг', better, value: r => r[a][b].kg,
    status: r => r[a][b].status, pct: r => r[a][b].percent,
  };
}
// Что считать улучшением: 1 — рост, -1 — снижение, 0 — нейтрально (вес и ИМТ зависят от цели)
const BETTER = { muscle: 1, lean_mass: 1, protein: 1, water: 1, bones: 1, fat: -1, visceral_fat: -1 };
const tone = (d, better) => d * better > 0 ? 'good' : d * better < 0 ? 'bad' : '';

// --- старт сравнения: выбирается вручную (например, после перерыва), хранится на сервере ---
const GAP_DAYS = 45;  // промежуток больше — перерыв (ежемесячные замеры по 31–33 дня перерывом не считаются)
const baseIdx = () => {
  const i = settings.start ? recs.findIndex(r => r.date >= settings.start) : 0;
  return i < 0 ? 0 : i;
};
const gapBefore = i => i > 0 ? Math.round((Date.parse(recs[i].date) - Date.parse(recs[i - 1].date)) / DAY) : 0;

function startSelect() {
  const b = baseIdx();
  return h('select', { class: 'inline', 'aria-label': 'Начало сравнения', onclick: e => e.stopPropagation(), onkeydown: e => e.stopPropagation(),
      onchange: e => setStart(recs[+e.target.value].date) },
    recs.map((r, i) => h('option', { value: i, selected: i === b || null },
      dmy(r.date) + (i === 0 ? ' (первый)' : gapBefore(i) > GAP_DAYS ? ` (после перерыва ${gapBefore(i)} дн)` : ''))).reverse());
}

async function setStart(date) {
  settings = date === recs[0].date ? {} : { start: date };
  if (view) { view.v0 = view.v1 = null; }  // окно графика — заново от нового старта
  render();
  if (openKey) openChart(openKey);
  try {
    const res = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ start: settings.start ?? null }) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  } catch (e) {
    notices = [{ text: `Не удалось сохранить начало сравнения: ${e.message}` }];
    render();
  }
}

function trendIcon(up) {  // как стрелка тренда в старом макете PDF
  const pts = up ? '1,8 5,4 8,6.5 13,1.5' : '1,1.5 5,5.5 8,3 13,8';
  const tip = up ? 'M9.5 1.5H13V5' : 'M9.5 8H13V4.5';
  return s('svg', { viewBox: '0 0 14 9.5', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' },
    s('polyline', { points: pts }), s('path', { d: tip }));
}

// --- рендер дашборда ---
function render() {
  if (!recs.length) {
    app.replaceChildren(h('header', {}, h('div', { class: 'brand' }, 'InBody ', h('span', {}, '· динамика')), uploadButton()),
      ...messages(), h('p', { class: 'muted' }, 'Замеров пока нет: загрузите PDF-отчёт InBody кнопкой или перетащите файл на страницу.'));
    return;
  }
  const cur = recs[idx], prev = recs[idx - 1];
  const after = [];

  const select = h('select', { 'aria-label': 'Дата замера', onchange: e => setIdx(+e.target.value) },
    recs.map((r, i) => h('option', { value: i, selected: i === idx || null }, dmy(r.date))).reverse());
  const header = h('header', {},
    h('div', { class: 'brand' }, 'InBody ', h('span', {}, '· динамика')),
    [['Имя', cur.name], ['Пол', cur.sex], ['Возраст', cur.age], ['Рост', `${cur.height_cm} см`]].map(([k, v]) => h('div', {}, h('span', { class: 'k' }, k), h('b', {}, v))),
    h('label', {}, h('span', { class: 'k' }, 'Дата'), select), exportButton(), uploadButton());

  // карточки Вес / Мышцы / Жир
  const cards = ['weight', 'muscle', 'fat'].map(k => {
    const m = cur.body[k];
    const d = prev && r2(m.value - prev.body[k].value);
    return act(h('div', { class: 'card metric' },
      h('div', { class: 'head' }, h('span', {}, BODY[k]), pill(m.status, m.status)),
      h('div', { class: 'big' }, withUnit(m.value, m.unit),
        d ? h('span', { class: 'trend', title: `к замеру ${dmy(prev.date)}` }, trendIcon(d > 0), fmt(Math.abs(d))) : null)), `body.${k}`);
  });

  const score = act(h('div', { class: 'card score' },
    h('div', { class: 'metric' }, h('div', { class: 'head' }, 'Оценка InBody'),
      cur.inbody_score == null ? h('div', { class: 'big muted' }, '—') : h('div', { class: 'big' }, cur.inbody_score, h('span', {}, '/100'))),
    h('p', {}, cur.inbody_score == null ? 'В этом отчёте оценки нет — она появилась в новом формате PDF.'
      : 'Общая оценка состава тела и телосложения. С развитой мускулатурой можно набрать больше 100 баллов.')), 'score');

  // история: последние N замеров до выбранного
  const width = app.clientWidth - 32;
  const histW = width > 760 ? (width - 12) * 2 / 3 - 34 : width - 34;
  const n = Math.max(3, Math.min(9, Math.floor((histW - 96) / 52)));
  const list = recs.slice(Math.max(0, idx - n + 1), idx + 1);
  const cols = `96px repeat(${list.length}, minmax(0, 1fr))`;
  const hrow = (k, label) => {
    const vals = list.map(r => r.body[k].value);
    const svg = s('svg', { 'aria-hidden': 'true' });
    after.push(() => sparkline(svg, vals));
    return act(h('div', { class: 'hrow', style: `--cols:${cols}` }, h('div', { class: 'lbl' }, label),
      vals.map(v => h('div', { class: 'v' }, fmt(v).replace('.', ','))), h('div', {}), svg), `body.${k}`);
  };
  const hist = h('div', { class: 'card hist' }, h('div', { class: 'title' }, 'История состава тела'),
    h('div', { class: 'hrow', style: `--cols:${cols}` }, h('div', {}), list.map(r => h('div', { class: 'd' }, dmy(r.date)))),
    hrow('weight', 'Вес, кг'), hrow('muscle', 'Мышцы, кг'), hrow('fat', 'Жир, %'));

  // шкалы норм
  const rrow = k => {
    const m = cur.body[k], p = scalePos(m.value, m.range), c = cls(m.status);
    return act(h('div', { class: `rrow ${c}` },
      h('div', { class: 'head' }, h('span', {}, BODY[k], m.status !== 'Норма' ? h('span', { class: 'st' }, m.status) : null), h('span', {}, withUnit(m.value, m.unit))),
      h('div', { class: 'bar' }, [0, 1, 2].map(i => h('i', {}, h('b', { style: `width:${Math.min(1, Math.max(0, p * 3 - i)) * 100}%` }))),
        h('span', { class: 'dot', style: `left:${p * 100}%` })),
      h('div', { class: 'scale' }, h('span', {}, `< ${m.range[0]}`), h('span', {}, `${m.range[0]}–${m.range[1]}`), h('span', {}, `> ${m.range[1]}`))), `body.${k}`);
  };
  const zones = h('div', { class: 'scale' }, h('span', {}, 'Ниже нормы'), h('span', {}, 'Норма'), h('span', {}, 'Выше нормы'));

  // изменения от стартового замера (по умолчанию первый) до выбранного
  const bi = baseIdx(), base = recs[bi];
  const lead = (label, key) => {
    const m = metric(key), d = m.value(cur) - m.value(base);
    return act(h('div', { class: 'lead' }, h('span', {}, label), h('b', { class: tone(d, m.better) }, withUnit(signed(d), m.unit))), key);
  };
  const progress = h('div', { class: 'card' },
    h('h3', {}, 'Изменения с ', startSelect(), ` по ${dmy(cur.date)}`),
    idx !== bi ? [lead('Вес', 'body.weight'), lead('Мышцы', 'body.muscle'), lead('Жир', 'body.fat'),
      lead('Жир, масса', 'segmental_fat.total_kg'), lead('Безжировая масса', 'body.lean_mass'), lead('Висцеральный жир', 'body.visceral_fat')]
      : h('p', { class: 'muted' }, 'Выбран стартовый замер — сравнивать пока не с чем.'));

  // сегменты: фигура из PDF + значения поверх
  const segCard = (blk, title, img) => h('div', { class: 'card' },
    act(h('div', { class: 'seghead' }, h('span', {}, title), h('span', {}, withUnit(cur[blk].total_kg, 'кг'))), `${blk}.total_kg`),
    h('div', { class: 'fig' }, h('img', { src: img, alt: '', onerror: e => e.target.remove() }),
      [['left_arm', 'la'], ['right_arm', 'ra'], ['trunk', 'trunk'], ['left_leg', 'll'], ['right_leg', 'rl']].map(([k, pos]) => {
        const g = cur[blk][k], c = cls(g.status);
        const kg = h('span', { class: 'kg' }, withUnit(g.kg, 'кг')), pc = pill(`${fmt(g.percent)} %`, g.status);
        const st = h('span', { class: `st ${c}` }, g.status);
        // порядок строк как в PDF: сверху кг первыми, снизу — последними
        const parts = pos === 'trunk' ? [h('span', {}, 'Торс ', st), kg, pc] : pos === 'll' || pos === 'rl' ? [st, pc, kg] : [kg, pc, st];
        return h('button', { class: `q ${pos}`, type: 'button', 'aria-label': `${title}: ${SEG[k]}`, onclick: () => openChart(`${blk}.${k}`) },
          h('span', { class: 'c' }, parts));
      })));

  app.replaceChildren(header, ...messages(),
    h('div', { class: 'row top' }, h('div', { class: 'stack' }, cards), h('div', { class: 'stack' }, score, hist)),
    h('div', { class: 'row' },
      h('div', { class: 'card' }, zones, ['weight', 'muscle', 'fat', 'water', 'protein', 'bones'].map(rrow)),
      h('div', { class: 'stack' }, h('div', { class: 'card' }, zones.cloneNode(true), ['visceral_fat', 'bmi', 'lean_mass'].map(rrow)), progress)),
    h('div', { class: 'row' }, segCard('segmental_muscle', 'Содержание мышц', '/figure/muscle.svg'), segCard('segmental_fat', 'Содержание жира', '/figure/fat.svg')));
  after.forEach(f => f());
}

// Положение на шкале как в PDF: три равные зоны, ниже нормы 0..lo, выше нормы hi..hi+(hi-lo)
function scalePos(v, [lo, hi]) {
  if (v < lo) return Math.max(0, v / lo) / 3;
  if (v > hi) return 2 / 3 + Math.min(1, (v - hi) / (hi - lo)) / 3;
  return 1 / 3 + (v - lo) / (hi - lo) / 3;
}

function sparkline(svg, vals) {
  const W = svg.clientWidth, H = 30, cw = W / vals.length;
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pt = (v, i) => [(i + .5) * cw, 7 + (hi - v) / span * (H - 14)];
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.replaceChildren(
    ...vals.map((_, i) => s('line', { x1: i * cw + .5, x2: i * cw + .5, y1: 0, y2: H, stroke: 'var(--line)' })),
    s('polyline', { points: vals.map((v, i) => pt(v, i).join(',')).join(' '), fill: 'none', stroke: 'var(--series)', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }),
    ...vals.map((v, i) => s('circle', { cx: pt(v, i)[0], cy: pt(v, i)[1], r: 3.5, fill: 'var(--series)', stroke: '#fff', 'stroke-width': 1.5 })));
}

// --- окно с графиком ---
const DAY = 864e5;
const COARSE = matchMedia('(pointer: coarse)').matches;
// Масштаб и активная точка переживают перерисовку (выбор замера, поворот экрана); сброс — при смене метрики
let view = null;
let tableOpen = false;  // раскрытая таблица остаётся раскрытой и у следующих графиков

function openChart(key) {
  openKey = key;
  if (view?.key !== key) view = { key, v0: null, v1: null, active: null, touchY: null, lastTap: 0, sort: null };
  const m = metric(key), pts = recs.filter(r => m.value(r) != null);
  const range = m.range && m.range(recs.at(-1));
  // старт — первый замер с этой метрикой не раньше выбранного (оценки InBody в старых отчётах нет)
  const startDate = recs[baseIdx()].date, bp = pts.find(r => r.date >= startDate) || pts[0];
  const firstV = m.value(bp), lastV = m.value(pts.at(-1));
  const box = h('div', { class: 'chart' }), tools = h('div', { class: 'ctools', role: 'group', 'aria-label': 'Период' });
  dlg.replaceChildren(
    h('div', { class: 'dhead' },
      h('div', {}, h('h2', {}, m.title),
        h('p', {}, 'С ', startSelect(), ` по ${dmy(pts.at(-1).date)}: `,
          h('b', {}, `${withUnit(firstV, m.unit)} → ${withUnit(lastV, m.unit)} `, h('span', { class: tone(lastV - firstV, m.better) }, `(${signed(lastV - firstV)})`)),
          bp.date !== startDate ? ` — первое значение ${dmy(bp.date)}` : '',
          range ? `. Зелёная полоса — норма ${range[0]}–${range[1]}` : '')),
      h('button', { class: 'x', type: 'button', 'aria-label': 'Закрыть', onclick: () => dlg.close() }, '×')),
    tools, box,
    h('p', { class: 'hint' }, COARSE
      ? 'Ведите пальцем — значения; щипок — масштаб, два пальца — сдвиг; двойной тап — весь период.'
      : 'Колесо — масштаб, перетаскивание — сдвиг, клик — выбрать замер, двойной клик — весь период. С клавиатуры: ← → + − 0.'),
    h('details', { open: tableOpen || null, ontoggle: e => { tableOpen = e.target.open; } },
      h('summary', {}, 'Таблица'), dataTable(m, pts)));
  if (!dlg.open) dlg.showModal();
  drawChart(box, tools, m, pts);
}

// --- таблица под графиком: сортировка, лучший результат, мягкий градиент, изменения ---
function dataTable(m, pts) {
  const startDate = recs[baseIdx()].date, inPeriod = r => r.date >= startDate;
  const per = pts.filter(inPeriod), vals = per.map(m.value);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  // лучший — за период со старта; рекорд — за всё время, если он был до старта
  const extreme = (list, sign) => list.reduce((a, r) => (m.value(r) - m.value(a)) * sign > 0 ? r : a);
  const best = m.better && per.length > 1 ? extreme(per, m.better) : null;
  const worst = best && extreme(per, -m.better);
  const record = m.better && pts.length > 1 ? extreme(pts, m.better) : null;
  const maxR = !m.better && per.length > 1 ? per.find(r => m.value(r) === hi) : null;
  const minR = maxR && per.find(r => m.value(r) === lo);
  const prevOf = new Map(pts.map((r, i) => [r, pts[i - 1]]));
  const dPrev = r => prevOf.get(r) ? r2(m.value(r) - m.value(prevOf.get(r))) : null;
  const dBase = r => inPeriod(r) && per.length ? r2(m.value(r) - m.value(per[0])) : null;
  const days = (a, b) => Math.round((Date.parse(a.date) - Date.parse(b.date)) / DAY);
  // фон значения: чем лучше (у нейтральных — чем больше), тем гуще; не больше ~18 %
  const shade = r => {
    if (!inPeriod(r) || hi === lo) return null;
    const g = (m.value(r) - lo) / (hi - lo), k = m.better < 0 ? 1 - g : g;
    return `background-color: rgb(${m.better ? '18 183 106' : '128 98 184'} / ${(.03 + k * .15).toFixed(3)})`;
  };
  const badge = r => r === best ? h('span', { class: 'badge' }, 'лучший')
    : r === record && !inPeriod(r) ? h('span', { class: 'badge old' }, 'рекорд')
    : r === maxR ? h('span', { class: 'badge old' }, 'макс') : r === minR ? h('span', { class: 'badge old' }, 'мин') : null;
  const dCell = d => d == null ? h('td', { class: 'muted' }, '—') : h('td', { class: tone(d, m.better) }, signed(d));
  const ranges = new Set(m.range ? pts.map(r => m.range(r).join('–')) : []);
  const cols = [
    { id: 'date', label: 'Дата', key: r => r.date, td: r => h('td', {}, dmy(r.date)) },
    { id: 'value', label: 'Значение', key: m.value, td: r => h('td', { style: shade(r) }, withUnit(m.value(r), m.unit), badge(r)) },
    { id: 'prev', label: 'К прошлому', key: dPrev, td: r => dCell(dPrev(r)) },
    per.length && { id: 'base', label: `От ${dmy(per[0].date)}`, key: dBase, td: r => dCell(dBase(r)) },
    m.status && { id: 'status', label: 'Статус', key: m.status, td: r => h('td', {}, h('span', { class: `st ${cls(m.status(r))}` }, m.status(r))) },
    m.pct && { id: 'pct', label: '% нормы', key: m.pct, td: r => h('td', {}, fmt(m.pct(r))) },
    ranges.size > 1 && { id: 'range', label: 'Норма', key: r => m.range(r)[0], td: r => h('td', {}, m.range(r).join('–')) },
  ].filter(Boolean);

  const pick = r => {  // строка -> выбрать замер и показать его на графике
    view.active = r.date; view.touchY = null;
    const t = Date.parse(r.date), span = view.v1 - view.v0;
    if (t < view.v0 || t > view.v1) { view.v0 = t - span / 2; view.v1 = t + span / 2; }
    const i = recs.indexOf(r);
    i === idx ? openChart(openKey) : setIdx(i);
  };

  const at = r => [h('b', {}, withUnit(m.value(r), m.unit)), ` (${dmy(r.date)})`];
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const stats = h('p', { class: 'stats' }, `С ${dmy(startDate)}: `,
    !per.length ? 'значений нет'
      : [best ? ['лучший ', at(best), ' · худший ', at(worst), ' · '] : maxR ? ['мин ', at(minR), ' · макс ', at(maxR), ' · '] : '',
        `среднее ${withUnit(r2(avg), m.unit)} · замеров ${per.length}`,
        record && !inPeriod(record) ? [' · рекорд за всё время ', at(record)] : '']);

  const wrap = h('div');
  const draw = () => {
    const sort = view.sort || { id: 'date', dir: -1 };
    const col = cols.find(c => c.id === sort.id) || cols[0];
    const rows = [...pts].sort((a, b) => {
      const ka = col.key(a), kb = col.key(b);
      if (ka == null || kb == null) return (ka == null) - (kb == null);  // пустые — всегда в конце
      return (ka < kb ? -1 : ka > kb ? 1 : 0) * sort.dir;
    });
    const body = [];
    for (const r of rows) {  // при сортировке по дате между строками видны перерывы
      const prev = prevOf.get(r), gap = prev ? days(r, prev) : 0;
      const gapRow = gap > GAP_DAYS && col.id === 'date' && h('tr', { class: 'gap' }, h('td', { colspan: cols.length }, `перерыв ${gap} дн`));
      if (gapRow && sort.dir > 0) body.push(gapRow);
      body.push(h('tr', { class: `${inPeriod(r) ? '' : 'old'} ${r.date === recs[idx].date ? 'sel' : ''}`, tabindex: 0,
        onclick: () => pick(r), onkeydown: e => { if (e.key === 'Enter') pick(r); } }, cols.map(c => c.td(r))));
      if (gapRow && sort.dir < 0) body.push(gapRow);
    }
    const head = h('tr', {}, cols.map(c => h('th', { 'aria-sort': c === col ? (sort.dir > 0 ? 'ascending' : 'descending') : null },
      h('button', { type: 'button', onclick: () => {
        // повторный клик — обратный порядок; новый столбец — сначала лучшие (у дат — новые)
        const firstDir = ['value', 'prev', 'base'].includes(c.id) && m.better < 0 ? 1 : -1;
        view.sort = { id: c.id, dir: c === col ? -sort.dir : firstDir };
        draw();
      } }, c.label, h('span', { class: 'arrow', 'aria-hidden': 'true' }, c === col ? (sort.dir > 0 ? '▲' : '▼') : '')))));
    wrap.replaceChildren(stats, h('div', { class: 'tablewrap' }, h('table', {}, h('thead', {}, head), h('tbody', {}, body))));
  };
  draw();
  return wrap;
}
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener('close', () => { openKey = null; view = null; });

function niceStep(span, n = 4) {
  const raw = span / n, p = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 2.5, 5, 10].map(k => k * p).find(st => st >= raw);
}

// Подписи оси времени: дни при крупном масштабе, месяцы (с годом у первого и у января) — при мелком
function timeTicks(v0, v1, maxN) {
  const span = (v1 - v0) / DAY, out = [];
  const dstep = [1, 2, 7, 14].find(d => span / d <= maxN);
  if (dstep) {
    for (let t = Math.ceil(v0 / DAY / dstep) * dstep * DAY; t <= v1; t += dstep * DAY) {
      const d = new Date(t);
      out.push([t, `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`]);
    }
    return out;
  }
  const mstep = [1, 2, 3, 6].find(k => span / (30.44 * k) <= maxN) || 12;
  const d = new Date(v0);
  d.setUTCHours(0, 0, 0, 0); d.setUTCDate(1);
  if (+d < v0) d.setUTCMonth(d.getUTCMonth() + 1);
  for (; +d <= v1; d.setUTCMonth(d.getUTCMonth() + 1)) {
    if (d.getUTCMonth() % mstep) continue;
    const yr = !out.length || d.getUTCMonth() === 0 ? ` ${String(d.getUTCFullYear()).slice(2)}` : '';
    out.push([+d, MON[d.getUTCMonth()] + yr]);
  }
  return out;
}

function drawChart(box, tools, m, recsWithValue) {
  const pts = recsWithValue.map(r => ({ r, t: Date.parse(r.date), v: m.value(r) }));
  const W = Math.max(box.clientWidth, 280), H = 300, L = 40, R = 64, T = 12, B = 26, PW = W - L - R, PH = H - T - B;
  // Весь период с полями, чтобы крайние точки не липли к осям; глубже 5 дней не увеличиваем
  let f0 = pts[0].t, f1 = pts.at(-1).t;
  if (f1 - f0 < 14 * DAY) { const c = (f0 + f1) / 2; f0 = c - 7 * DAY; f1 = c + 7 * DAY; }
  const edge = (f1 - f0) * .03; f0 -= edge; f1 += edge;
  const clampView = (a, b) => {
    const span = Math.min(Math.max(b - a, 5 * DAY), f1 - f0);
    a = Math.min(Math.max(a, f0), f1 - span);
    return [a, a + span];
  };
  // старт сравнения: по умолчанию график открывается с него, всё до него приглушено
  const startDate = recs[baseIdx()].date, baseT = Date.parse(startDate), hasBase = baseT > pts[0].t;
  const startV0 = baseT - (f1 - baseT) * .04;
  [view.v0, view.v1] = clampView(view.v0 ?? (hasBase ? startV0 : f0), view.v1 ?? f1);

  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, tabindex: 0, role: 'img', 'aria-label': `${m.title}: график по датам` });
  const layer = s('g');
  const vline = s('line', { y1: T, y2: T + PH, stroke: 'var(--rule)', visibility: 'hidden' });
  const ring = s('circle', { r: 7, fill: 'var(--series)', stroke: '#fff', 'stroke-width': 2, visibility: 'hidden' });
  const tip = h('div', { class: 'tip', hidden: true });
  svg.append(s('defs', {}, s('clipPath', { id: 'plot-clip' }, s('rect', { x: L, y: T, width: PW, height: PH }))), layer, vline, ring);
  box.replaceChildren(svg, tip);

  const PRESETS = [['Месяц', () => [f1 - 30 * DAY, f1]], ['3 мес', () => [f1 - 91 * DAY, f1]], ['Полгода', () => [f1 - 182 * DAY, f1]],
    ...(hasBase ? [[`С ${dmy(startDate)}`, () => [startV0, f1]]] : []), ['Всё', () => [f0, f1]]];
  const presetBtns = PRESETS.map(([label, win]) => h('button', { type: 'button', onclick: () => setView(...win()) }, label));
  tools.replaceChildren(...presetBtns);

  let x = null, y = null, frame = 0;
  function paint() {
    const { v0, v1 } = view, span = v1 - v0;
    x = t => L + (t - v0) / span * PW;
    // Шкала Y — по точкам в окне (если в окне пусто — по ближайшим соседям)
    let vis = pts.filter(p => p.t >= v0 && p.t <= v1);
    if (!vis.length) vis = [pts.findLast(p => p.t < v0), pts.find(p => p.t > v1)].filter(Boolean);
    let lo = Math.min(...vis.map(p => p.v)), hi = Math.max(...vis.map(p => p.v));
    const pad = Math.max((hi - lo) * .15, Math.abs(hi) * .01, .1), step = niceStep(hi - lo + 2 * pad);
    lo = Math.floor((lo - pad) / step) * step; hi = Math.ceil((hi + pad) / step) * step;
    y = v => T + (hi - v) / (hi - lo) * PH;

    const clip = { 'clip-path': 'url(#plot-clip)' }, kids = [];
    if (m.range) {  // полоса нормы
      const up = pts.map(p => [x(p.t), y(m.range(p.r)[1])]), dn = pts.map(p => [x(p.t), y(m.range(p.r)[0])]);
      up.unshift([Math.min(L, up[0][0]), up[0][1]]); up.push([Math.max(L + PW, up.at(-1)[0]), up.at(-1)[1]]);
      dn.unshift([Math.min(L, dn[0][0]), dn[0][1]]); dn.push([Math.max(L + PW, dn.at(-1)[0]), dn.at(-1)[1]]);
      kids.push(s('polygon', { ...clip, points: [...up, ...dn.reverse()].map(p => p.join(',')).join(' '), fill: 'var(--ok)', 'fill-opacity': .1 }));
    }
    for (let i = 0, n = Math.round((hi - lo) / step); i <= n; i++) {
      const v = r2(lo + i * step);
      kids.push(s('line', { x1: L, x2: L + PW, y1: y(v), y2: y(v), stroke: 'var(--line)' }),
        s('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end' }, fmt(v)));
    }
    for (const [t, label] of timeTicks(v0, v1, Math.max(2, Math.floor(PW / 64)))) {
      if (x(t) < L + 10 || x(t) > L + PW - 10) continue;
      kids.push(s('line', { x1: x(t), x2: x(t), y1: T + PH, y2: T + PH + 4, stroke: 'var(--rule)' }),
        s('text', { x: x(t), y: H - 6, 'text-anchor': 'middle' }, label));
    }
    const sel = recs[idx].date, last = pts.at(-1);
    kids.push(s('line', { x1: L, x2: L + PW, y1: T + PH, y2: T + PH, stroke: 'var(--rule)' }),
      s('path', { ...clip, d: pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.t)},${y(p.v)}`).join(''), fill: 'none', stroke: 'var(--series)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }),
      ...pts.map(p => s('circle', { ...clip, cx: x(p.t), cy: y(p.v), r: p.r.date === sel ? 6 : 4, fill: p.r.date === sel ? 'var(--ink)' : 'var(--series)', stroke: '#fff', 'stroke-width': 2 })));
    if (hasBase && x(baseT) > L) {  // до старта — под белой дымкой, на старте — отметка
      const bx = Math.min(x(baseT), L + PW);
      kids.push(s('rect', { x: L, y: T, width: bx - L, height: PH, fill: '#fff', 'fill-opacity': .6 }));
      if (bx < L + PW) kids.push(s('line', { x1: bx, x2: bx, y1: T, y2: T + PH, stroke: 'var(--ink)', 'stroke-opacity': .35 }),
        s('text', { x: bx + 4, y: T + 10 }, 'старт'));
    }
    if (last.t <= v1) kids.push(s('text', { class: 'end', x: x(last.t) + 10, y: y(last.v) + 4 }, withUnit(last.v, m.unit)));
    layer.replaceChildren(...kids);

    presetBtns.forEach((b, i) => {
      const [a, c] = clampView(...PRESETS[i][1]());
      b.setAttribute('aria-pressed', Math.abs(a - v0) < DAY && Math.abs(c - v1) < DAY);
    });
    const ai = pts.findIndex(p => p.r.date === view.active);
    ai >= 0 ? show(ai) : hide();
  }
  const setView = (a, b) => {
    [view.v0, view.v1] = clampView(a, b);
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(paint);
  };

  // Перекрестие + подсказка. При касании подсказка уходит в другую половину графика, чтобы её не закрывал палец
  function show(i) {
    const p = pts[i], px = x(p.t), py = y(p.v);
    if (px < L - 1 || px > L + PW + 1) return hide();
    vline.setAttribute('x1', px); vline.setAttribute('x2', px);
    ring.setAttribute('cx', px); ring.setAttribute('cy', py);
    vline.setAttribute('visibility', 'visible'); ring.setAttribute('visibility', 'visible');
    const prev = pts[i - 1];
    tip.replaceChildren(...[h('b', {}, withUnit(p.v, m.unit)), h('div', {}, dmy(p.r.date), prev ? ` · ${signed(p.v - prev.v)} к прошлому` : ''),
      m.status && h('div', { class: `st ${cls(m.status(p.r))}` }, m.status(p.r)), m.pct && h('div', { class: 'muted' }, `${fmt(m.pct(p.r))} % от нормы`)].filter(Boolean));
    tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    if (view.touchY == null) {
      tip.style.left = `${px + 12 + tw > W ? px - tw - 12 : px + 12}px`;
      tip.style.top = `${Math.max(0, py - th - 8)}px`;
    } else {
      tip.style.left = `${Math.min(Math.max(px - tw / 2, 0), W - tw)}px`;
      tip.style.top = `${view.touchY > T + PH / 2 ? T : T + PH - th}px`;
    }
  }
  function hide() {
    tip.hidden = true;
    vline.setAttribute('visibility', 'hidden'); ring.setAttribute('visibility', 'hidden');
  }

  // --- жесты (Pointer Events: мышь, палец, перо одним кодом) ---
  const rect = () => svg.getBoundingClientRect();
  const sx = e => (e.clientX - rect().left) * W / rect().width;
  const sy = e => (e.clientY - rect().top) * H / rect().height;
  const tAt = px => view.v0 + (px - L) / PW * (view.v1 - view.v0);
  const nearest = px => {  // ближайшая по горизонтали точка из видимых
    let best = -1;
    pts.forEach((p, i) => {
      if (p.t < view.v0 || p.t > view.v1) return;
      if (best < 0 || Math.abs(x(p.t) - px) < Math.abs(x(pts[best].t) - px)) best = i;
    });
    return best;
  };
  const point = (e, touch) => {
    const i = nearest(sx(e));
    if (i < 0) return;
    view.active = pts[i].r.date;
    view.touchY = touch ? sy(e) : null;
    show(i);
  };
  const select = i => {
    if (i < 0) return;
    view.active = pts[i].r.date;
    const ri = recs.indexOf(pts[i].r);
    ri === idx ? show(i) : setIdx(ri);
  };

  const ptrs = new Map();
  let g = null;  // текущий жест: scrub | pan | pinch | done
  svg.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    try { svg.setPointerCapture(e.pointerId); } catch { /* указатель уже неактивен */ }
    ptrs.set(e.pointerId, e);
    if (ptrs.size === 2) {  // щипок: даты под пальцами остаются под пальцами
      const [a, b] = [...ptrs.values()].map(sx);
      g = { type: 'pinch', ta: tAt(a), tb: tAt(b) };
      view.active = null; hide();
    } else if (ptrs.size > 2) {
      g = { type: 'done' };
    } else if (e.pointerType === 'mouse') {
      g = { type: 'pan', x0: sx(e), v0: view.v0, v1: view.v1, moved: false };
    } else {
      g = { type: 'scrub', x0: sx(e), t: e.timeStamp, moved: false };
      point(e, true);
    }
  });
  svg.addEventListener('pointermove', e => {
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, e);
    if (g?.type === 'pinch' && ptrs.size === 2) {
      const [a, b] = [...ptrs.values()].map(sx);
      if (Math.abs(b - a) < 20) return;
      const k = (g.tb - g.ta) / (b - a), v0 = g.ta - (a - L) * k;  // время на пиксель и левый край окна
      setView(v0, v0 + PW * k);
    } else if (g?.type === 'pan') {
      const dx = sx(e) - g.x0;
      if (Math.abs(dx) > 3) { g.moved = true; svg.style.cursor = 'grabbing'; hide(); }
      if (g.moved) { const dt = dx / PW * (g.v1 - g.v0); setView(g.v0 - dt, g.v1 - dt); }
    } else if (g?.type === 'scrub') {
      if (Math.abs(sx(e) - g.x0) > 8) g.moved = true;
      point(e, true);
    } else if (!g && e.pointerType === 'mouse') {
      point(e, false);
    }
  });
  const up = e => {
    ptrs.delete(e.pointerId);
    if (g?.type === 'pinch' || g?.type === 'done') { g = ptrs.size ? { type: 'done' } : null; return; }
    const done = g;
    g = null;
    svg.style.cursor = '';
    if (!done || e.type === 'pointercancel') return;
    if (done.type === 'pan' && !done.moved) select(nearest(sx(e)));
    if (done.type === 'scrub' && !done.moved && e.timeStamp - done.t < 300) {  // тап; второй подряд — весь период
      if (e.timeStamp - view.lastTap < 350) { view.lastTap = 0; setView(f0, f1); }
      else { view.lastTap = e.timeStamp; select(nearest(sx(e))); }
    }
  };
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', up);
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !g) { view.active = null; hide(); } });
  svg.addEventListener('dblclick', () => setView(f0, f1));
  svg.addEventListener('contextmenu', e => { if (COARSE) e.preventDefault(); });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const span = view.v1 - view.v0;
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {  // горизонтальная прокрутка тачпада — сдвиг
      const dt = e.deltaX / PW * span;
      return setView(view.v0 + dt, view.v1 + dt);
    }
    const px = sx(e), t = tAt(px), ns = span * Math.exp(e.deltaY * (e.ctrlKey ? .01 : .0015));
    const v0 = t - (px - L) / PW * ns;  // дата под курсором остаётся на месте
    setView(v0, v0 + ns);
  }, { passive: false });
  svg.addEventListener('focus', () => {
    if (svg.matches(':focus-visible') && !view.active) { view.active = pts.at(-1).r.date; view.touchY = null; show(pts.length - 1); }
  });
  svg.addEventListener('keydown', e => {
    let i = pts.findIndex(p => p.r.date === view.active);
    const span = view.v1 - view.v0;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      i = i < 0 ? pts.length - 1 : Math.max(0, Math.min(pts.length - 1, i + (e.key === 'ArrowLeft' ? -1 : 1)));
      view.active = pts[i].r.date; view.touchY = null;
      const t = pts[i].t;
      t < view.v0 || t > view.v1 ? setView(t - span / 2, t + span / 2) : show(i);
    } else if (e.key === '+' || e.key === '=' || e.key === '-') {
      const c = i >= 0 ? pts[i].t : (view.v0 + view.v1) / 2, ns = span * (e.key === '-' ? 1.5 : 1 / 1.5);
      setView(c - ns / 2, c + ns / 2);
    } else if (e.key === '0') setView(f0, f1);
    else if (e.key === 'Enter' && i >= 0) select(i);
    else return;
    e.preventDefault();
  });

  paint();
}

function setIdx(i) {
  idx = i;
  history.replaceState(null, '', `#${recs[i].date}`);
  render();
  if (openKey) openChart(openKey);
}

let raf = 0;
addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { render(); if (openKey) openChart(openKey); }); });

// --- загрузка PDF ---
const messages = () => [...errors.map(e => h('p', { class: 'error' }, e)), ...notices.map(n => h('p', { class: n.ok ? 'notice' : 'error' }, n.text))];

function exportButton() {
  const first = recs[0].date, last = recs.at(-1).date;
  const date = (name, v) => h('input', { type: 'date', name, value: v, min: first, max: last, required: true });
  const radio = (v, t) => h('label', { class: 'r' }, h('input', { type: 'radio', name: 'format', value: v, checked: v === 'csv' || null }), t);
  const dlg = h('dialog', {}, h('form', { method: 'get', action: '/api/export', onsubmit: () => setTimeout(() => dlg.close()) },
    h('b', {}, 'Выгрузка замеров'),
    h('label', {}, h('span', { class: 'k' }, 'С'), date('from', first)),
    h('label', {}, h('span', { class: 'k' }, 'По'), date('to', last)),
    radio('csv', 'CSV (Excel)'), radio('json', 'JSON (все данные)'),
    h('div', { class: 'btns' },
      h('button', { class: 'upload export', type: 'button', onclick: () => dlg.close() }, 'Отмена'),
      h('button', { class: 'upload', type: 'submit' }, 'Скачать'))));
  return [h('button', { class: 'upload export', type: 'button', onclick: () => dlg.showModal() }, 'Выгрузить'), dlg];
}

function uploadButton() {
  const input = h('input', { type: 'file', accept: 'application/pdf,.pdf', multiple: true, hidden: true, onchange: e => upload([...e.target.files]) });
  return [h('button', { class: 'upload', type: 'button', title: 'Или перетащите PDF на страницу', onclick: () => input.click() }, 'Загрузить PDF'), input];
}

async function upload(files) {
  notices = [{ ok: true, text: `Загружаю файлов: ${files.length}…` }];
  render();
  const done = [];
  notices = [];
  for (const f of files) {
    try {
      const res = await fetch('/api/upload', { method: 'POST', body: f, headers: { 'Content-Type': 'application/pdf' } });
      const d = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      if (res.ok) done.push(d.date); else notices.push({ text: `${f.name}: ${d.error}` });
    } catch (e) {
      notices.push({ text: `${f.name}: ${e}` });
    }
  }
  if (done.length) notices.unshift({ ok: true, text: `Загружено: ${done.map(dmy).join(', ')}` });
  await load(done.at(-1));
}

addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  const pdfs = [...e.dataTransfer.files].filter(f => /\.pdf$/i.test(f.name));
  if (pdfs.length) upload(pdfs);
});

async function load(date) {
  try {
    const res = await fetch('/api/data');
    if (res.status === 401) return location.assign('/login');  // вход истёк, пока страница была открыта
    const d = await res.json();
    recs = d.records; errors = d.errors; settings = d.settings || {};
  } catch (e) {
    errors = [`Не удалось загрузить данные: ${e}`];
  }
  const i = recs.findIndex(r => r.date === (date || location.hash.slice(1)));
  idx = i >= 0 ? i : recs.length - 1;
  if (date && i >= 0) history.replaceState(null, '', `#${date}`);
  render();
}
load();
</script>
</body>
</html>
